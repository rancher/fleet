name: GitHub Actions Security Analysis with zizmor

on:
  push:
    branches: ["main", "release/v*"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # used by zizmor to write events for advanced security features
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928 # v0.7.0
        with:
          advanced-security: ${{ github.repository == 'rancher/fleet' }}
          config: .github/zizmor.yml
