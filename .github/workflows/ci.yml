name: CI

on:
  schedule:
    - cron:  '0 5 * * *'
  pull_request:
  push:
    branches:
    - '*-hotfix-*'

permissions:
  contents: read

env:
  GOARCH: amd64
  CGO_ENABLED: 0

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      -
        name: Set up chart-testing
        run: |
          ./.github/scripts/install-chart-testing.sh
          echo "$HOME/.local/share/chart-testing-venv/bin" >> "$GITHUB_PATH"
      -
        name: Run chart-testing (lint)
        run: ct lint --all --validate-maintainers=false charts/
      -
        name: helm-unittest
        run: |
          plugin_args=()
          if [[ "$(helm version --template '{{.Version}}')" == v4.* ]]; then
            # Helm 4 refuses to install git-sourced plugins unless signature verification is explicitly disabled, and its VCS installer does not support verification. Helm 3 has no such flag.
            plugin_args+=(--verify=false)
          fi
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.0.2 "${plugin_args[@]}"
          helm unittest ./charts/fleet
          helm unittest ./charts/fleet-agent
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      -
        name: unit-test
        run: |
          mapfile -t packages < <(go list ./... | grep -v -e /e2e -e /integrationtests -e /benchmarks)
          go test -shuffle=on "${packages[@]}"
      -
        name: unit-test-helmvalues
        working-directory: pkg/helmvalues
        run: go test -shuffle=on ./...

  integration-tests-group1:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      -
        name: integration-tests-group1
        env:
          # renovate: datasource=go depName=sigs.k8s.io/controller-runtime
          SETUP_ENVTEST_VER: v0.24.0
          ENVTEST_K8S_VERSION: 1.37
        run: ./.github/scripts/run-integration-tests-group1.sh

  integration-tests-group2:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      -
        name: integration-tests-group2
        env:
          # renovate: datasource=go depName=sigs.k8s.io/controller-runtime
          SETUP_ENVTEST_VER: v0.24.0
          ENVTEST_K8S_VERSION: 1.37
        run: ./.github/scripts/run-integration-tests-group2.sh
