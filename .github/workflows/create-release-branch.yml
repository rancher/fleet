name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      major:
        description: True if a new branch must be created for a major release, false otherwise. Patch releases do not require new release branches.
        default: false
        required: false
        type: boolean

permissions:
  contents: write

env:
  GOARCH: amd64
  CGO_ENABLED: 0

jobs:
  create-release-branch:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: compute new release version number
        id: branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -z "$latest" ]; then
            echo "Could not extract latest version from repo; aborting."
            exit 1
          fi

          members=${latest#v}
          major_member=$(echo $members | cut -d'.' -f1)
          minor_member=$(echo $members | cut -d'.' -f2)

          if [ ${{ github.event.inputs.major }} = 'true' ]; then
            new_version="$(( major_member + 1 )).0.0"
          else
            new_version="$major_member.$(( minor_member + 1 )).0"
          fi

          version="release/v$new_version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: checkout rancher/fleet-test-data
        if: steps.branch.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: "rancher/fleet-test-data"
          path: fleet-test-data

      - name: create release branch in fleet-test-data
        id: test_branch
        if: steps.branch.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{steps.branch.outputs.version}}
        working-directory: ./fleet-test-data/
        run: |
          if ! git checkout -b $BRANCH; then
            echo "Could not create branch $version. Skipping."
          else
            gh auth setup-git
            git push -u origin $BRANCH
          fi

          if git checkout $BRANCH; then
            echo "branch_exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "branch_exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: configure git
        id: git_config
        if: steps.branch.outputs.version != ''
        env:
          BRANCH: ${{steps.branch.outputs.version}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -e ~/.gitconfig ]; then
            echo "Configuring git username and email"
            git config --global user.name "fleet-bot"
            git config --global user.email fleet@suse.de
          fi

          gh auth setup-git

          err_file=/tmp/branch_create_err

          branch=$BRANCH

          if ! git checkout -b $BRANCH &>$err_file; then
            if ! grep -q 'already exists' $err_file; then
              echo "Could not create branch $version. Skipping."

              exit 1
            fi

            # branch already exists; pushes will require a PR, so create a feature branch
            branch="${BRANCH//\//-}-$(date +'%s')"
          fi

          echo "work_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: checkout rancher/renovate-config
        if: steps.branch.outputs.version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "rancher/renovate-config"
          path: renovate-config
          ref: main

      - name: add Renovate support to new release branch
        if: steps.branch.outputs.version != ''
        env:
          BRANCH: ${{steps.branch.outputs.version}}
          WORK_BRANCH: ${{steps.git_config.outputs.work_branch}}
        run: |
          if [ "$WORK_BRANCH" != "$BRANCH" ]; then
            git checkout -b "$WORK_BRANCH"
          fi

          if grep -q "$BRANCH" .github/renovate.json; then
            echo "Renovate config already set for $BRANCH; skipping."
            exit 0
          fi

          rancher_minor_member=$(( $(echo $BRANCH | cut -d'.' -f2) - 1 ))

          # Check existence of renovate config file for Rancher release branch
          path="rancher-2.$rancher_minor_member"
          pushd renovate-config

          if ! git cat-file -e origin/main:$path.json; then
            echo "File $path does not exist in rancher/renovate-config's main branch. Exiting."
            popd
            exit 1
          fi

          popd

          sed -Ei "/\"main\",/a \"$BRANCH\"," .github/renovate.json
          cat <<EOF >renovate_block.json
              {
                "matchBaseBranches": [
                  "$BRANCH"
                ],
                "extends": [
                  "github>rancher/renovate-config//$path#main"
                ]
              },
          EOF

          # Add the new block once, after the first existing block (terminated by `},`)
          sed -i "0,/},/{/},/ r renovate_block.json
          }" .github/renovate.json

          # Indent the file properly
          jq . .github/renovate.json > formatted.json
          mv formatted.json .github/renovate.json

          git --no-pager diff .github/renovate.json

          git add .github/renovate.json
          git commit -m "Add Renovate support to branch $BRANCH"

      - name: update benchmarks assets to point to rancher/fleet-test-data release branch
        if: steps.branch.outputs.version != '' && steps.test_branch.outputs.branch_exists == 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{steps.branch.outputs.version}}
          WORK_BRANCH: ${{steps.git_config.outputs.work_branch}}
        run: |
          if grep -Rq "$BRANCH" benchmarks/assets; then
            echo "Benchmark assets already point to $BRANCH; skipping."
            exit 0
          fi

          find benchmarks/assets -type f -exec sed -i "s,branch:.*$,branch: $BRANCH," {} \;

          git --no-pager diff benchmarks/assets

          git add benchmarks/assets
          git commit -m "Point benchmarks assets to $BRANCH"

      - name: push changes
        if: steps.branch.outputs.version == steps.git_config.outputs.work_branch
        env:
          BRANCH: ${{steps.branch.outputs.version}}
        run: |
            # the release branch does not already exist; directly pushing it should succeed.
            git push -u origin $BRANCH

      - name: submit a PR
        if: steps.branch.outputs.version != steps.git_config.outputs.work_branch
        env:
          BRANCH: ${{steps.branch.outputs.version}}
        run: |
          # The branch already exists: it cannot be directly pushed to because
          # it is protected, so create a PR against it
          gh pr create --title "[$BRANCH] Update Renovate config" \
                       --body "Update Renovate config in ${BRANCH} to point to ${path}"$'\n\n'"Update benchmark testing assets to point to `rancher/fleet-test-data`'s ``{$BRANCH}`` branch." \
                       --base "${BRANCH}"
