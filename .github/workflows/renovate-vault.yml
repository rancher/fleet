name: Renovate
on:
  workflow_dispatch:
    inputs:
      overrideSchedule:
        description: "Override all schedules"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      configMigration:
        description: "Toggle PRs for config migration"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      renovateConfig:
        description: "Define a custom renovate config file"
        required: false
        default: ".github/renovate.json"
        type: string
      minimumReleaseAge:
        description: "Override minimumReleaseAge for a one-time run (e.g., '0 days' to disable delay). Applies to every dependency unless minimumReleaseAgePackages is set"
        required: false
        default: "null"
        type: string
      minimumReleaseAgePackages:
        description: "Comma separated package names to accept any release for during this run (e.g., 'go,golang'). Requires minimumReleaseAge '0 days'. Empty applies the override to every dependency"
        required: false
        default: ""
        type: string
      refreshGroup:
        description: "Accept any release for a whole update group instead of listing package names. Go covers the toolchain, go.mod directives, Dockerfile and workflow Go images, golangci-lint and hardened-build-base"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - go
          - kubernetes
          - security
          - github-actions

  schedule:
    - cron: '30 6 * * 1-5'

permissions: {}

jobs:
  call-workflow:
    permissions:
      contents: read
      id-token: write # Required for Vault OIDC authentication.
    # https://github.com/rancher/renovate-config/releases
    uses: rancher/renovate-config/.github/workflows/renovate-vault.yml@25cb0e4e38b4931d4a551db492bf2cf47dac03f1 # v1.0.14
    # Note: github.event.inputs.<name> with '||' fallbacks is used across all inputs
    # so that scheduled cron runs (where github.event.inputs is null) safely default.
    with:
      configMigration: ${{ github.event.inputs.configMigration || 'true' }}
      overrideSchedule: ${{ github.event.inputs.overrideSchedule || 'false' }}
      renovateConfig: ${{ github.event.inputs.renovateConfig || '.github/renovate.json' }}
      minimumReleaseAge: ${{ github.event.inputs.minimumReleaseAge || 'null' }}
      minimumReleaseAgePackages: ${{ github.event.inputs.minimumReleaseAgePackages || '' }}
      refreshGroup: ${{ github.event.inputs.refreshGroup || '' }}
    secrets:
      # Optional: RENOVATE_FORK_GH_TOKEN allows this action to run on repository forks where
      # Vault/App token generation is unavailable. Defaulting to '' allows the caller
      # to fall back gracefully on standard runs without failing secret evaluation.
      override-token: "${{ secrets.RENOVATE_FORK_GH_TOKEN || '' }}"
