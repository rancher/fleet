# Fleet release workflow
name: Fleet release

on:
  push:
    tags:
      - v**

permissions:
  contents: write
  id-token: write # this is important, it's how we authenticate with Vault

env:
  GOARCH: amd64
  CGO_ENABLED: 0
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  release-fleet:
    runs-on: runs-on,runner=8cpu-linux-x64,mem=16,run-id=${{ github.run_id }}
    outputs:
      chart-version: ${{ steps.publish-charts.outputs.version }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
      checks: read

    env:
      IS_HOTFIX: ${{ contains(github.ref, '-hotfix-') }}

    container:
      image: ghcr.io/rancher/ci-image/go1.27:1.27.4
      # GoReleaser publishes images with buildx, which needs the runner's Docker daemon.
      options: --volume /var/run/docker.sock:/var/run/docker.sock

    if: github.repository == 'rancher/fleet'
    steps:
      - name: Check out Fleet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify CI passed on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: ./.github/scripts/verify-ci-on-commit.sh

      - name: Tag Go modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([.-].*)?$ ]]; then
            echo "ERROR: unexpected release tag format '${RELEASE_TAG}'; expected v<major>.<minor>.<patch>" >&2
            exit 1
          fi

          module_tags=("pkg/apis/${RELEASE_TAG}")
          if [[ -f pkg/helmvalues/go.mod ]]; then
            module_tags+=("pkg/helmvalues/${RELEASE_TAG}")
          fi

          for module_tag in "${module_tags[@]}"; do
            ref="refs/tags/${module_tag}"
            # Skip module tags already published by an earlier release attempt.
            if git ls-remote --exit-code --refs origin "${ref}" >/dev/null 2>&1; then
              echo "Ref ${ref} already exists; continuing"
              continue
            fi

            # Create an annotated tag object targeting the release commit.
            tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
              --method POST \
              --field "tag=${module_tag}" \
              --field "message=Release ${RELEASE_TAG}" \
              --field "object=${GITHUB_SHA}" \
              --field "type=commit")
            # Publish the tag ref, making the annotated tag object reachable.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              --field "ref=${ref}" \
              --field "sha=$(jq -r '.sha' <<< "${tag_object}")" >/dev/null
          done

      - name: Check Go toolchain
        shell: bash
        run: |
          set -euo pipefail

          # Same behavior as `go-version-file: go.mod`, which prefers the toolchain directive.
          go_version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' go.mod)
          go_version=${go_version:-$(awk '$1 == "go" { print $2; exit }' go.mod)}

          installed=$(go env GOVERSION)
          if [[ "${installed}" != "go${go_version}" ]]; then
            echo "ERROR: container provides ${installed}, go.mod requires go${go_version}" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # renovate: datasource=docker depName=tonistiigi/binfmt extractVersion=^qemu-v(?<version>.+)$
          image: tonistiigi/binfmt:qemu-v10.2.1-65@sha256:d3b963f787999e6c0219a48dba02978769286ff61a5f4d26245cb6a6e5567ea3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Read Vault Secrets"
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | STAGE_REGISTRY_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | STAGE_REGISTRY_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGE_REGISTRY ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;

      - name: Log into Docker Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ env.IS_HOTFIX == 'false' }}
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log into Staging registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.STAGE_REGISTRY_USERNAME }}
          password: ${{ env.STAGE_REGISTRY_PASSWORD }}
          registry: ${{ env.STAGE_REGISTRY }}

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}
          STAGE_REGISTRY: ${{ env.STAGE_REGISTRY }}
          PRIME_REGISTRY: ${{ env.PRIME_REGISTRY }}
        shell: bash
        run: goreleaser release --clean --draft --verbose

      - name: Attest provenance
        shell: bash
        env:
          STAGE_REGISTRY: ${{ env.STAGE_REGISTRY }}
        run: |
          set -euo pipefail

          if [[ ! -f dist/digests.txt ]] || [[ ! -s dist/digests.txt ]]; then
            echo "ERROR: dist/digests.txt not found or empty"
            exit 1
          fi

          # Extract staging images (exclude platform-specific tags)
          # Format: <digest>  <image:tag> → only staging registry images
          staging_images=$(grep -v -- '-linux-' dist/digests.txt | \
            awk '{print "sha256:" $1, $NF}' | \
            grep -F -- "${STAGE_REGISTRY}" || true)

          if [[ -z "$staging_images" ]]; then
            echo "ERROR: No staging images found"
            exit 1
          fi

          echo "=== Staging images for attestation ==="
          echo "$staging_images"
          echo ""

          max_retries=3

          while read -r digest image_ref; do
            echo ""
            echo "Attesting: ${image_ref}"
            echo "  Digest: ${digest}"

            for platform in "linux/amd64" "linux/arm64"; do
              echo "  Platform ${platform}..."
              prov_file="provenance_${platform/\//_}.json"

              # Retry download
              for ((i=1; i<=max_retries; i++)); do
                echo "    Attempt ${i}/${max_retries}..."

                if slsactl download provenance --format=slsav1 --platform="${platform}" "${image_ref}@${digest}" > "${prov_file}"; then
                  echo "      ✓ Downloaded provenance"
                  break
                fi

                if [ "${i}" -eq "${max_retries}" ]; then
                  echo "ERROR: Failed to download provenance for ${platform} of ${image_ref} after ${max_retries} attempts"
                  exit 1
                fi

                echo "      Waiting before retry..."
                sleep 5
              done

              # Attest (must succeed)
              if ! cosign attest --yes --predicate "${prov_file}" --type slsaprovenance1 "${image_ref}@${digest}" 2>&1; then
                echo "ERROR: cosign attest failed for ${platform} of ${image_ref}"
                rm -f "${prov_file}"
                exit 1
              fi

              echo "      ✓ Attested"
              rm -f "${prov_file}"
            done
          done <<< "$staging_images"

          echo ""
          echo "✓ Provenance attestation completed for all images"

      # Remove this step once cargueiro ships in the ci-image.
      - name: Install cargueiro
        if: ${{ env.IS_HOTFIX == 'false' }}
        env:
          # renovate: datasource=github-releases depName=rancher/cargueiro
          CARGUEIRO_VERSION: v0.2.1
          # renovate: datasource=github-release-attachments depName=rancher/cargueiro digestVersion=v0.2.1
          CARGUEIRO_SUM: c3b1c4ff3a783cb941061a705206f698ab4ce840499f8b444b54ce00a487a962
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/rancher/cargueiro/releases/download/${CARGUEIRO_VERSION}/cargueiro_linux_amd64" \
            -o /usr/local/bin/cargueiro
          echo "${CARGUEIRO_SUM}  /usr/local/bin/cargueiro" | sha256sum -c -
          chmod +x /usr/local/bin/cargueiro

      - name: Publish charts to the OCI staging registry
        if: ${{ env.IS_HOTFIX == 'false' }}
        id: publish-charts
        shell: bash
        env:
          CARGUEIRO_USERNAME: ${{ env.STAGE_REGISTRY_USERNAME }}
          CARGUEIRO_PASSWORD: ${{ env.STAGE_REGISTRY_PASSWORD }}
          REGISTRY: ${{ env.STAGE_REGISTRY }}/rancher/catalog
        run: |
          set -euo pipefail

          work_dir=$(mktemp -d)
          trap 'rm -rf "${work_dir}"' EXIT

          # The chart annotations and the image tags are already on the
          # archives; only the Rancher chart version still has to be set, which
          # cargueiro stamps.
          dirs=()
          for chart in fleet fleet-agent fleet-crd; do
            dir="${work_dir}/${chart}"
            mkdir -p "${dir}"
            tar -xzf ".charts/${chart}-${RELEASE_TAG#v}.tgz" -C "${dir}" --strip-components=1
            dirs+=("${dir}")
          done

          # The charts of the family share one version. A re-run of this release
          # reuses the version it pushed already, instead of releasing the next
          # one.
          published=$(cargueiro list "${REGISTRY}/fleet" 2>/dev/null || true)
          version=$(awk -v suffix="+up${RELEASE_TAG#v}" \
            'substr($0, length($0) - length(suffix) + 1) == suffix { print; exit }' <<< "${published}")
          if [[ -z "${version}" ]]; then
            version=$(cargueiro chart-version --family fleet --registry "${REGISTRY}" "${dirs[@]}")
          fi

          cargueiro stamp --family fleet "${dirs[@]}" --version "${version}"
          # package runs the chart checks and builds the archives to push.
          packaged=$(cargueiro package --family fleet "${dirs[@]}" --output-dir "${work_dir}/dist")
          mapfile -t archives <<< "${packaged}"
          # The charts of this version that the registry has already are skipped.
          cargueiro push --family fleet "${archives[@]}" --registry "${REGISTRY}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish Release
        if: ${{ env.IS_HOTFIX == 'false' }}
        run: |
          set -euo pipefail

          make_latest=false
          if current_latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null); then
            if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              if [[ "$(printf '%s\n' "${current_latest}" "${RELEASE_TAG}" | sort -V | tail -n1)" == "${RELEASE_TAG}" ]]; then
                make_latest=true
              fi
            fi
          fi

          gh release edit "${RELEASE_TAG}" --draft=false --latest="${make_latest}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-charts:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # Shipping the family waits for its run in rancher/charts, which queues
    # behind the runs of other repositories.
    timeout-minutes: 30
    needs: release-fleet
    # Skip hotfix releases; they follow a separate process.
    if: github.repository == 'rancher/fleet' && !contains(github.ref, '-hotfix-')
    steps:
      - name: Read App Secrets
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials privateKey | PRIVATE_KEY

      - name: Create App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            charts
            fleet-helm-charts
          permission-actions: write

      - name: Dispatch to rancher/fleet-helm-charts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run sync-fleet-releases.yml \
            --repo rancher/fleet-helm-charts

      - name: Ship charts to rancher/charts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART_VERSION: ${{ needs.release-fleet.outputs.chart-version }}
        run: |
          set -euo pipefail
          # API version 2026-03-10 returns the run ID of the dispatch.
          run_id=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            repos/rancher/charts/actions/workflows/chart-staged.yaml/dispatches \
            -f ref=staging -f 'inputs[family]=fleet' -f "inputs[version]=${CHART_VERSION}" \
            --jq '.workflow_run_id // error("no run ID returned")')
          gh run watch "${run_id}" --repo rancher/charts --exit-status --interval 20
