apiVersion: apps/v1
kind: Deployment
metadata:
  name: pause-imagescan
  labels:
    app: pause
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pause
  template:
    metadata:
      labels:
        app: pause
    spec:
      containers:
      - name: pause
        image: registry.k8s.io/pause:latest # {"$imagescan": "test-scan:digest"}
