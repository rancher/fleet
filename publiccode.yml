description:
  en:
    shortDescription: >-
      Fleet is GitOps and HelmOps at scale, designed to manage a single or multiple clusters
    longDescription: |
      Fleet is GitOps and HelmOps at scale across a big amount of clusters, deployments and
      teams in a single organization, but it's lightweight enough at small scale.

      Fleet can manage deployments from git of raw Kubernetes YAML, Helm charts, or Kustomize or any
      combination of the three. Regardless of the source all resources are dynamically turned into
      Helm charts and Helm is used as the engine to deploy everything in the cluster. This gives a
      high degree of control, consistency, and auditability. Fleet focuses not only on the ability
      to scale, but to give one a high degree of control and visibility to exactly what is installed
      on the cluster.
    documentation: https://fleet.rancher.io/how-tos-for-users/gitrepo-add
    apiDocumentation: https://fleet.rancher.io/reference/ref-crds
