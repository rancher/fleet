suite: allowUnlabeledKubeConfigSecretNamespaces is rendered into the fleet-controller configmap
templates:
  - configmap.yaml
tests:
  - it: defaults allowUnlabeledKubeConfigSecretNamespaces to false
    asserts:
      - matchRegex:
          path: data.config
          pattern: '"allowUnlabeledKubeConfigSecretNamespaces":\s*false'

  - it: emits allowUnlabeledKubeConfigSecretNamespaces true when set
    set:
      allowUnlabeledKubeConfigSecretNamespaces: true
    asserts:
      # Must be the JSON boolean, which the Go config field requires.
      - matchRegex:
          path: data.config
          pattern: '"allowUnlabeledKubeConfigSecretNamespaces":\s*true'

  - it: emits false when the value is missing, e.g. from reused values of an earlier release
    set:
      allowUnlabeledKubeConfigSecretNamespaces: null
    asserts:
      - matchRegex:
          path: data.config
          pattern: '"allowUnlabeledKubeConfigSecretNamespaces":\s*false'
