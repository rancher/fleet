description:
  en:
    shortDescription: >-
      Fleet is GitOps and HelmOps at scale, designed to manage workloads on multiple Kubernetes clusters
    longDescription: |
      Fleet is a GitOps and HelmOps solution enabling continuous deployment at scale across large 
      numbers of clusters.

      Fleet can manage deployments from Helm repositories, OCI registries, and git repositories 
      containing raw Kubernetes YAML, Helm charts, Kustomize, or any combination of the three.
      It relies on a two-step mechanism, where deployments are packaged from their sources on a 
      management cluster, then pulled by agents on target cluster, which install them as Helm charts.
      This provides a high degree of control, consistency, and auditability. Fleet focuses on
      simplicity, scalability, control and visibility over deployments across clusters.
    documentation: https://fleet.rancher.io/tutorials/quickstart
    apiDocumentation: https://fleet.rancher.io/reference/ref-crds
    features:
      - Cluster Control
      - Cluster Monitoring
      - Deployment Management
      - GitOps
      - HelmOps
      - Drift correction
      - Per-cluster customization of deployments
